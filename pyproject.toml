[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-mind-ai"
version = "1.0.0"
description = "Production-Grade Deep Research & Hybrid RAG SaaS Platform with Parallel RRF and Claim-Level Citations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chunduri Sushen", email = "sushen.chunduri@example.com" }
]
keywords = ["rag", "deep-research", "hybrid-retrieval", "rrf", "chromadb", "bm25", "fastapi"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.4.24",
    "google-generativeai>=0.4.1",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
researchmind = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
